name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      # lockfile 在 Windows 本地生成，npm 不会把 Linux 专用的
      # @rollup/rollup-linux-x64-gnu 等原生二进制写进 package-lock.json
      # (npm bug #4828)，导致在 Linux runner 上 vite/rollup 构建报
      # "Cannot find module"。这里忽略跨平台不可用的 lock，让 npm 按
      # package.json 在当前平台重新解析并正确安装原生二进制。
      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Lint
        run: npm run lint

      - name: Run build
        run: npm run build
